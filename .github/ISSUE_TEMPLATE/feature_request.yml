name: Feature or tool request
description: Suggest a new tool, a new capability, or a documentation improvement.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the workflow problem first, then the
        solution you have in mind. Search existing issues and the tool catalog
        before submitting.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Model Management
        - Sheets & Views
        - Parameters
        - Families
        - Geometry
        - Documentation
        - Utilities
        - Repository / tooling
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and what makes it difficult today?
      placeholder: "I need to create 200 sheets from an Excel table..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired inputs, outputs, and result.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, packages, or manual workarounds.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots with synthetic data, links, or version constraints.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the tool catalog.
          required: true
        - label: This request does not contain confidential data.
          required: true
        - label: I am willing to help test or document the feature. (optional)
