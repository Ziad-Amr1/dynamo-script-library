name: Update catalog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-main
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate catalog
        run: python tools/generate_catalog.py

      - name: Validate generated result
        run: |
          python tools/validate_manifests.py
          python tools/check_links.py
          python tools/generate_catalog.py --check

      - name: Commit catalog if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update generated tool catalog"
          git push
